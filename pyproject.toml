[project]
name = "ha-pyur-modem"
version = "0.1.0"
requires-python = ">=3.14.2"
# No runtime dependencies — this project is not installed as a Python package.
# HA discovers the component via config/custom_components (symlink) at runtime,
# and tests find it via sys.path (see conftest.py).
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component>=0.13.330",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]
